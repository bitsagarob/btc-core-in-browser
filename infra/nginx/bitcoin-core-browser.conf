# Bitcoin Core compiled to WebAssembly, served at /bitcoin-core-browser/.
#
# The build is multithreaded: script verification runs on real pthreads, which
# Emscripten backs with web workers sharing one SharedArrayBuffer. A browser
# only hands out SharedArrayBuffer to a cross-origin isolated page, and a page
# is only cross-origin isolated with both COOP and COEP. Without these two
# headers the module refuses to start, with no useful error.
#
# Same reasoning as the /seedsigner-simulator/ block. Every header is repeated
# in the nested locations rather than inherited, because add_header does not
# inherit into a location that declares one of its own. Dropping COEP or CORP
# there would silently un-isolate the page for its own assets.
#
# The Content Security Policy is stricter than the site-wide one, because this
# path serves nothing third-party and its own scripts are external files rather
# than inline blocks:
#   script-src   'self' plus 'wasm-unsafe-eval', which is what compiling a
#                WebAssembly module needs. No 'unsafe-inline': the loader lives
#                in boot.js for exactly that reason. No 'unsafe-eval' either:
#                the build uses -sDYNAMIC_EXECUTION=0, which removes the two
#                `new Function` calls from the Emscripten glue.
#   worker-src   'self' blob: because Emscripten spawns one web worker per
#                pthread, from this origin.
#   style-src    keeps 'unsafe-inline' because Qt writes inline style
#                attributes onto the elements it manages.
location ^~ /bitcoin-core-browser/ {
  gzip_static on;

  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  # The page, the loader and the manifest change with every deploy and are tiny.
  add_header Cache-Control "public, max-age=300" always;

  try_files $uri $uri/ =404;

  # bitcoin-qt.<8 hex>.js, .wasm and .data carry a content hash in the name, so
  # the bytes behind a given URL can never change. 75 MB uncompressed is worth
  # not re-downloading.
  location ~* ^/bitcoin-core-browser/bitcoin-qt\.[0-9a-f]{8}\.(js|wasm|data)$ {
    gzip_static on;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
}
